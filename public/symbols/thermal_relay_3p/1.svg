<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" width="120" height="60">
  <circle id="terminal_1" cx="20" cy="0" r="2.5" fill="#1e293b" />
  <circle id="terminal_2" cx="20" cy="60" r="2.5" fill="#1e293b" />
  <circle id="terminal_3" cx="60" cy="0" r="2.5" fill="#1e293b" />
  <circle id="terminal_4" cx="60" cy="60" r="2.5" fill="#1e293b" />
  <circle id="terminal_5" cx="100" cy="0" r="2.5" fill="#1e293b" />
  <circle id="terminal_6" cx="100" cy="60" r="2.5" fill="#1e293b" />

  <!-- Enlace mecánico y caja térmica -->
  <rect x="10" y="22" width="100" height="16" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" />
  <line x1="4" y1="30" x2="108" y2="30" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3 2" />

  <g stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Polo 1 (1-2) -->
    <line x1="20" y1="0" x2="20" y2="22" />
    <path d="M20,22 L14,22 L14,30 L26,30 L26,38 L20,38" stroke="#ef4444" stroke-width="1.5" />
    <line x1="20" y1="38" x2="20" y2="60" />

    <!-- Polo 2 (3-4) -->
    <line x1="60" y1="0" x2="60" y2="22" />
    <path d="M60,22 L54,22 L54,30 L66,30 L66,38 L60,38" stroke="#ef4444" stroke-width="1.5" />
    <line x1="60" y1="38" x2="60" y2="60" />

    <!-- Polo 3 (5-6) -->
    <line x1="100" y1="0" x2="100" y2="22" />
    <path d="M100,22 L94,22 L94,30 L106,30 L106,38 L100,38" stroke="#ef4444" stroke-width="1.5" />
    <line x1="100" y1="38" x2="100" y2="60" />
  </g>
</svg>

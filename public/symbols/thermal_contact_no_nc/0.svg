<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" width="80" height="60">
  <!-- Bornes identificadores para OpenSimu (mesa 80x60) -->
  <!-- Polo 1 (95-96) en X=20, Polo 2 (97-98) en X=60 -->
  <circle id="terminal_95" cx="20" cy="0" r="2.5" fill="#1e293b" />
  <circle id="terminal_96" cx="20" cy="60" r="2.5" fill="#1e293b" />
  <circle id="terminal_97" cx="60" cy="0" r="2.5" fill="#1e293b" />
  <circle id="terminal_98" cx="60" cy="60" r="2.5" fill="#1e293b" />

  <!-- Enlace mecánico continuo que sobresale a la izquierda con omega (Capa inferior, gris) -->
  <line x1="7.5" y1="32" x2="68" y2="32" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 2" stroke-linecap="round" />

  <!-- Parte fija y cuchillas en negro -->
  <g stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Polo 1 (NC 95-96) en X=20 -->
    <line x1="20" y1="0" x2="20" y2="20" />
    <line x1="20" y1="20" x2="30" y2="20" />
    <line x1="20" y1="42" x2="20" y2="60" />
    <!-- Cuchilla cerrada NC -->
    <line x1="20" y1="42" x2="28" y2="16" />

    <!-- Polo 2 (NA 97-98) en X=60 -->
    <line x1="60" y1="0" x2="60" y2="20" />
    <line x1="60" y1="42" x2="60" y2="60" />
    <!-- Cuchilla abierta NA -->
    <line x1="60" y1="42" x2="50" y2="22" />

    <!-- Omega cuadrada de relé térmico a la izquierda del conjunto (_П_ L=6) -->
    <path d="M7.5,32 L7.5,26 L1.5,26 L1.5,32 L-2.5,32" stroke="#0f172a" stroke-width="1.5" />
  </g>
</svg>

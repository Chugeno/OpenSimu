<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" width="80" height="60">
  <!-- Bornes identificadores para OpenSimu (mesa 80x60) -->
  <!-- COM (95) en (40, 0), NC (96) en (20, 60), NA (98) en (60, 60) -->
  <circle id="terminal_95" cx="40" cy="0" r="2.5" fill="#1e293b" />
  <circle id="terminal_96" cx="20" cy="60" r="2.5" fill="#1e293b" />
  <circle id="terminal_98" cx="60" cy="60" r="2.5" fill="#1e293b" />

  <!-- Línea de vinculación mecánica (Capa inferior, gris) -->
  <line x1="33" y1="30" x2="25" y2="30" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2" stroke-linecap="round" />

  <!-- Parte fija y cuchilla basculante en negro -->
  <g stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Entrada COM (40,0) a (40,18) -->
    <line x1="40" y1="0" x2="40" y2="18" />

    <!-- Salida NC (20,60) a (20,42) y barra fija hacia la derecha (30,42) -->
    <line x1="20" y1="60" x2="20" y2="42" />
    <line x1="20" y1="42" x2="30" y2="42" />

    <!-- Salida NA (60,60) a (60,42) y barra fija hacia la izquierda (50,42) -->
    <line x1="60" y1="60" x2="60" y2="42" />
    <line x1="60" y1="42" x2="50" y2="42" />

    <!-- Cuchilla basculante en reposo (de (40,18) a contacto NC en (26,42)) -->
    <line x1="40" y1="18" x2="26" y2="42" />

    <!-- Omega cuadrada de relé térmico (_П_ L=6) -->
    <path d="M25,30 L25,24 L19,24 L19,30 L15,30" stroke="#0f172a" stroke-width="1.5" />
  </g>
</svg>

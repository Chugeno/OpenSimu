<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 60" width="40" height="60">
  <!-- Bornes identificadores para OpenSimu (mesa 40x60, bornes en X=20) -->
  <circle id="terminal_95" cx="20" cy="0" r="2.5" fill="#1e293b" />
  <circle id="terminal_96" cx="20" cy="60" r="2.5" fill="#1e293b" />

  <!-- Línea de vinculación mecánica (Capa inferior, gris) -->
  <line x1="29" y1="31" x2="21" y2="31" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2" stroke-linecap="round" />

  <!-- Parte fija y cuchilla en negro -->
  <g stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Conductores verticales y tope fijo -->
    <line x1="20" y1="0" x2="20" y2="20" />
    <line x1="20" y1="20" x2="30" y2="20" />
    <line x1="20" y1="42" x2="20" y2="60" />

    <!-- Cuchilla abierta (disparo NC: de (20,42) a (36,22) separándose del tope) -->
    <line x1="20" y1="42" x2="36" y2="22" />

    <!-- Omega cuadrada de relé térmico (_П_ lados iguales L=6) -->
    <path d="M21,31 L21,25 L15,25 L15,31 L11,31" stroke="#0f172a" stroke-width="1.5" />
  </g>
</svg>

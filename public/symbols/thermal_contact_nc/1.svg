<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 0 40 60" width="40" height="60">
  <!-- Bornes superior (0,0) e inferior (0,60) -->
  <!-- Línea de vinculación mecánica (Capa inferior, gris) -->
  <line x1="9" y1="31" x2="1" y2="31" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2" stroke-linecap="round" />
  
  <!-- Parte fija y bornes en negro -->
  <g stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Puntos de bornes -->
    <circle cx="0" cy="0" r="2.5" fill="#1e293b" stroke="none" />
    <circle cx="0" cy="60" r="2.5" fill="#1e293b" stroke="none" />
    
    <!-- Conductores verticales y tope fijo -->
    <line x1="0" y1="0" x2="0" y2="20" />
    <line x1="0" y1="20" x2="10" y2="20" />
    <line x1="0" y1="42" x2="0" y2="60" />
    
    <!-- Cuchilla abierta (disparo térmico: abre separándose hacia (16,22)) -->
    <line x1="0" y1="42" x2="16" y2="22" />
    
    <!-- Omega cuadrada de relé térmico (_П_ lados iguales L=6) -->
    <path d="M1,31 L1,25 L-5,25 L-5,31 L-9,31" stroke="#0f172a" stroke-width="1.5" />
  </g>
</svg>

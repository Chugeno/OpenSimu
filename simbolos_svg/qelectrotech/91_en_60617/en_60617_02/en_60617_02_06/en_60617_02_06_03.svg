<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5.0 -10.0 10.0 20.0" width="10.0" height="20.0">
  <title>Se activa cuando la cantidad característica es mayor que un valor de ajuste alto, o menor por debajo de un valor de ajuste bajo</title>
  <line x1="-1" y1="-5" x2="1" y2="-3" stroke="black" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="1" y1="-3" x2="-1" y2="-1" stroke="black" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="1" y1="1" x2="-1" y2="3" stroke="black" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="-1" y1="3" x2="1" y2="5" stroke="black" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 65" width="180" height="65">
  <style>
    .symbol-stroke { stroke: #1e293b; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .symbol-dashed { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 3,2; fill: none; }
    .terminal-dot { fill: #94a3b8; }
    .text-num { font-family: sans-serif; font-size: 8px; fill: #64748b; }
    .text-tag { font-family: sans-serif; font-size: 10px; font-weight: bold; fill: #0f172a; text-anchor: start; }
    .text-mag { font-family: sans-serif; font-size: 7px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
  </style>

  <!-- Tag identificador -->
  <text x="4" y="16" class="text-tag">-QM1</text>

  <!-- Mecanismo de accionamiento manual (IEC 60617 Pág 7) -->
  <g id="actuator">
    <!-- Cuadrado con cruz centrado en (32, 25) -->
    <rect x="26" y="19" width="12" height="12" class="symbol-stroke" />
    <line x1="26" y1="25" x2="38" y2="25" class="symbol-stroke" />
    <line x1="32" y1="19" x2="32" y2="31" class="symbol-stroke" />
    <!-- Maneta manual T -->
    <line x1="32" y1="19" x2="32" y2="11" class="symbol-stroke" />
    <line x1="28" y1="11" x2="36" y2="11" class="symbol-stroke" />
  </g>

  <!-- Enlace mecánico horizontal a los contactos -->
  <line x1="38" y1="25" x2="140" y2="25" class="symbol-dashed" />

  <!-- Lazos de disparo mecánico hacia el mando -->
  <line x1="54" y1="41" x2="32" y2="41" class="symbol-dashed" />
  <line x1="54" y1="51" x2="32" y2="51" class="symbol-dashed" />
  <line x1="32" y1="31" x2="32" y2="51" class="symbol-dashed" />

  <!-- ================= POLO 1 (1 - 2 en X = 60) ================= -->
  <g id="pole_1">
    <circle cx="60" cy="0" r="2.5" class="terminal-dot" />
    <circle cx="60" cy="60" r="2.5" class="terminal-dot" />
    <text x="65" y="10" class="text-num">1</text>
    <text x="65" y="58" class="text-num">2</text>
    <!-- Contacto superior fijo -->
    <line x1="60" y1="0" x2="60" y2="18" class="symbol-stroke" />
    <line x1="57" y1="18" x2="63" y2="18" class="symbol-stroke" />
    <!-- Cuchilla con cruz X -->
    <line x1="60" y1="34" x2="52" y2="18" class="symbol-stroke" />
    <line x1="53.5" y1="23" x2="57.5" y2="27" class="symbol-stroke" />
    <line x1="57.5" y1="23" x2="53.5" y2="27" class="symbol-stroke" />
    <!-- Bloque térmico bimetal -->
    <rect x="54" y="36" width="12" height="10" class="symbol-stroke" />
    <path d="M 60,34 L 60,38 L 63,38 L 63,44 L 60,44 L 60,46" class="symbol-stroke" />
    <!-- Bloque magnético con I> -->
    <rect x="54" y="46" width="12" height="10" class="symbol-stroke" />
    <text x="60" y="54" class="text-mag">I&gt;</text>
    <line x1="60" y1="56" x2="60" y2="60" class="symbol-stroke" />
  </g>

  <!-- ================= POLO 2 (3 - 4 en X = 100) ================= -->
  <g id="pole_2">
    <circle cx="100" cy="0" r="2.5" class="terminal-dot" />
    <circle cx="100" cy="60" r="2.5" class="terminal-dot" />
    <text x="105" y="10" class="text-num">3</text>
    <text x="105" y="58" class="text-num">4</text>
    <!-- Contacto superior fijo -->
    <line x1="100" y1="0" x2="100" y2="18" class="symbol-stroke" />
    <line x1="97" y1="18" x2="103" y2="18" class="symbol-stroke" />
    <!-- Cuchilla con cruz X -->
    <line x1="100" y1="34" x2="92" y2="18" class="symbol-stroke" />
    <line x1="93.5" y1="23" x2="97.5" y2="27" class="symbol-stroke" />
    <line x1="97.5" y1="23" x2="93.5" y2="27" class="symbol-stroke" />
    <!-- Bloque térmico bimetal -->
    <rect x="94" y="36" width="12" height="10" class="symbol-stroke" />
    <path d="M 100,34 L 100,38 L 103,38 L 103,44 L 100,44 L 100,46" class="symbol-stroke" />
    <!-- Bloque magnético con I> -->
    <rect x="94" y="46" width="12" height="10" class="symbol-stroke" />
    <text x="100" y="54" class="text-mag">I&gt;</text>
    <line x1="100" y1="56" x2="100" y2="60" class="symbol-stroke" />
  </g>

  <!-- ================= POLO 3 (5 - 6 en X = 140) ================= -->
  <g id="pole_3">
    <circle cx="140" cy="0" r="2.5" class="terminal-dot" />
    <circle cx="140" cy="60" r="2.5" class="terminal-dot" />
    <text x="145" y="10" class="text-num">5</text>
    <text x="145" y="58" class="text-num">6</text>
    <!-- Contacto superior fijo -->
    <line x1="140" y1="0" x2="140" y2="18" class="symbol-stroke" />
    <line x1="137" y1="18" x2="143" y2="18" class="symbol-stroke" />
    <!-- Cuchilla con cruz X -->
    <line x1="140" y1="34" x2="132" y2="18" class="symbol-stroke" />
    <line x1="133.5" y1="23" x2="137.5" y2="27" class="symbol-stroke" />
    <line x1="137.5" y1="23" x2="133.5" y2="27" class="symbol-stroke" />
    <!-- Bloque térmico bimetal -->
    <rect x="134" y="36" width="12" height="10" class="symbol-stroke" />
    <path d="M 140,34 L 140,38 L 143,38 L 143,44 L 140,44 L 140,46" class="symbol-stroke" />
    <!-- Bloque magnético con I> -->
    <rect x="134" y="46" width="12" height="10" class="symbol-stroke" />
    <text x="140" y="54" class="text-mag">I&gt;</text>
    <line x1="140" y1="56" x2="140" y2="60" class="symbol-stroke" />
  </g>
</svg>

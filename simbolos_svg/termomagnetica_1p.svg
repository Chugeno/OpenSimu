<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <style>
    .symbol-stroke { stroke: #1e293b; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .symbol-thin { stroke: #64748b; stroke-width: 1.2; stroke-linecap: round; fill: none; }
    .terminal-dot { fill: #94a3b8; }
    .text-num { font-family: sans-serif; font-size: 8px; fill: #64748b; }
    .text-tag { font-family: sans-serif; font-size: 10px; font-weight: bold; fill: #0f172a; text-anchor: end; }
  </style>

  <!-- Tag identificador -->
  <text x="18" y="32" class="text-tag">-Q1</text>

  <!-- Terminales de conexión (Borna 1 en Y=0, Borna 2 en Y=60) -->
  <g id="terminals">
    <circle cx="30" cy="0" r="2.5" class="terminal-dot" />
    <circle cx="30" cy="60" r="2.5" class="terminal-dot" />
    <text x="35" y="10" class="text-num">1</text>
    <text x="35" y="55" class="text-num">2</text>
  </g>

  <!-- Conductor superior hasta contacto fijo -->
  <g id="contact_top">
    <line x1="30" y1="0" x2="30" y2="18" class="symbol-stroke" />
    <!-- Marca fija de seccionamiento/interruptor IEC 60617 -->
    <line x1="27" y1="18" x2="33" y2="18" class="symbol-stroke" />
  </g>

  <!-- Cuchilla móvil abierta con poder de corte (Cruz X) -->
  <g id="blade">
    <!-- Cuchilla inclinada que abre hacia la izquierda -->
    <line x1="30" y1="36" x2="22" y2="18" class="symbol-stroke" />
    <!-- Cruz (X) en la cuchilla: Interruptor automático con poder de corte -->
    <line x1="23.5" y1="23" x2="27.5" y2="27" class="symbol-stroke" />
    <line x1="27.5" y1="23" x2="23.5" y2="27" class="symbol-stroke" />
  </g>

  <!-- Disparador térmico (Bimetal rectangular IEC 60617) -->
  <g id="thermal_trip">
    <!-- Muesca rectangular bimetálica -->
    <path d="M 30,36 L 30,38 L 34,38 L 34,44 L 30,44 L 30,46" class="symbol-stroke" />
  </g>

  <!-- Disparador magnético (Cortocircuito IEC 60617) -->
  <g id="magnetic_trip">
    <!-- Semicírculo / corchete electromagnético -->
    <path d="M 30,46 L 30,48 A 4,4 0 0,1 30,54 L 30,60" class="symbol-stroke" />
  </g>
</svg>

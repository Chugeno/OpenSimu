<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 65" width="180" height="65">
  <style>
    .symbol-stroke { stroke: #1e293b; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .symbol-dashed { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 3,2; fill: none; }
    .terminal-dot { fill: #94a3b8; }
    .text-num { font-family: sans-serif; font-size: 8px; fill: #64748b; }
    .text-tag { font-family: sans-serif; font-size: 10px; font-weight: bold; fill: #0f172a; text-anchor: start; }
  </style>

  <!-- Tag identificador a la izquierda -->
  <text x="4" y="16" class="text-tag">-Q1</text>

  <!-- Mecanismo de accionamiento manual (cuadrado con cruz y maneta T a la izquierda) -->
  <g id="actuator">
    <!-- Cuadrado 12x12 centrado en (32, 25) -->
    <rect x="26" y="19" width="12" height="12" class="symbol-stroke" />
    <line x1="26" y1="25" x2="38" y2="25" class="symbol-stroke" />
    <line x1="32" y1="19" x2="32" y2="31" class="symbol-stroke" />
    <!-- Maneta manual con barra en T superior -->
    <line x1="32" y1="19" x2="32" y2="11" class="symbol-stroke" />
    <line x1="28" y1="11" x2="36" y2="11" class="symbol-stroke" />
  </g>

  <!-- Enlace mecánico discontinuo entre polos y hacia el mando -->
  <line x1="38" y1="25" x2="140" y2="25" class="symbol-dashed" />

  <!-- ================= POLO 1 (1 - 2 en X = 60) ================= -->
  <g id="pole_1">
    <!-- Terminales (Y=0 arriba, Y=60 abajo) -->
    <circle cx="60" cy="0" r="2.5" class="terminal-dot" />
    <circle cx="60" cy="60" r="2.5" class="terminal-dot" />
    <text x="65" y="10" class="text-num">1</text>
    <text x="65" y="55" class="text-num">2</text>
    <!-- Contacto superior fijo -->
    <line x1="60" y1="0" x2="60" y2="18" class="symbol-stroke" />
    <line x1="57" y1="18" x2="63" y2="18" class="symbol-stroke" />
    <!-- Cuchilla móvil con cruz X -->
    <line x1="60" y1="36" x2="52" y2="18" class="symbol-stroke" />
    <line x1="53.5" y1="23" x2="57.5" y2="27" class="symbol-stroke" />
    <line x1="57.5" y1="23" x2="53.5" y2="27" class="symbol-stroke" />
    <!-- Bimetal térmico (muesca rectangular) -->
    <path d="M 60,36 L 60,38 L 64,38 L 64,44 L 60,44 L 60,46" class="symbol-stroke" />
    <!-- Disparador magnético -->
    <path d="M 60,46 L 60,48 A 4,4 0 0,1 60,54 L 60,60" class="symbol-stroke" />
  </g>

  <!-- ================= POLO 2 (3 - 4 en X = 100) ================= -->
  <g id="pole_2">
    <!-- Terminales -->
    <circle cx="100" cy="0" r="2.5" class="terminal-dot" />
    <circle cx="100" cy="60" r="2.5" class="terminal-dot" />
    <text x="105" y="10" class="text-num">3</text>
    <text x="105" y="55" class="text-num">4</text>
    <!-- Contacto superior fijo -->
    <line x1="100" y1="0" x2="100" y2="18" class="symbol-stroke" />
    <line x1="97" y1="18" x2="103" y2="18" class="symbol-stroke" />
    <!-- Cuchilla móvil con cruz X -->
    <line x1="100" y1="36" x2="92" y2="18" class="symbol-stroke" />
    <line x1="93.5" y1="23" x2="97.5" y2="27" class="symbol-stroke" />
    <line x1="97.5" y1="23" x2="93.5" y2="27" class="symbol-stroke" />
    <!-- Bimetal térmico -->
    <path d="M 100,36 L 100,38 L 104,38 L 104,44 L 100,44 L 100,46" class="symbol-stroke" />
    <!-- Disparador magnético -->
    <path d="M 100,46 L 100,48 A 4,4 0 0,1 100,54 L 100,60" class="symbol-stroke" />
  </g>

  <!-- ================= POLO 3 (5 - 6 en X = 140) ================= -->
  <g id="pole_3">
    <!-- Terminales -->
    <circle cx="140" cy="0" r="2.5" class="terminal-dot" />
    <circle cx="140" cy="60" r="2.5" class="terminal-dot" />
    <text x="145" y="10" class="text-num">5</text>
    <text x="145" y="55" class="text-num">6</text>
    <!-- Contacto superior fijo -->
    <line x1="140" y1="0" x2="140" y2="18" class="symbol-stroke" />
    <line x1="137" y1="18" x2="143" y2="18" class="symbol-stroke" />
    <!-- Cuchilla móvil con cruz X -->
    <line x1="140" y1="36" x2="132" y2="18" class="symbol-stroke" />
    <line x1="133.5" y1="23" x2="137.5" y2="27" class="symbol-stroke" />
    <line x1="137.5" y1="23" x2="133.5" y2="27" class="symbol-stroke" />
    <!-- Bimetal térmico -->
    <path d="M 140,36 L 140,38 L 144,38 L 144,44 L 140,44 L 140,46" class="symbol-stroke" />
    <!-- Disparador magnético -->
    <path d="M 140,46 L 140,48 A 4,4 0 0,1 140,54 L 140,60" class="symbol-stroke" />
  </g>
</svg>
